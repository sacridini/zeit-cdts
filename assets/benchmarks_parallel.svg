<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" class="benchmark-chart" role="img" aria-label="Multi-Core Scaling on 20 Threads">
  <style>
    .bm-gridline { stroke: var(--bm-grid, #e2e8f0); stroke-width: 1; }
    .bm-refline { stroke: var(--bm-refline, #94a3b8); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .bm-ref-label { font-size: 11px; font-weight: 600; fill: var(--bm-muted, #64748b); font-family: monospace; }
    .bm-axis-tick { font-size: 11px; font-weight: 600; fill: var(--bm-muted, #64748b); font-family: monospace; }
    .bm-bar-label { font-size: 13px; font-weight: 600; fill: var(--bm-text, #1e293b); font-family: system-ui, -apple-system, sans-serif; }
    .bm-bar-val { font-size: 12px; font-weight: 700; fill: var(--bm-text, #1e293b); font-family: monospace; }
    .bm-zeit-bar { fill: var(--bm-zeit, #2563eb); }
    .bm-ref-bar { fill: var(--bm-ref, #ea580c); }
    .bm-gpu-lo { fill: var(--bm-gpu-lo, #60a5fa); }
    .bm-gpu-hi { fill: var(--bm-gpu-hi, #1d4ed8); }
    .bm-bar-rect { cursor: pointer; }
    .bm-bar-group:hover .bm-bar-rect { filter: brightness(1.12); }
    @media (prefers-color-scheme: dark) {
      :root:not([data-md-color-scheme="default"]) {
        --bm-grid: #334155;
        --bm-refline: #64748b;
        --bm-muted: #94a3b8;
        --bm-text: #f1f5f9;
        --bm-zeit: #3b82f6;
        --bm-ref: #f97316;
        --bm-gpu-lo: #60a5fa;
        --bm-gpu-hi: #93c5fd;
      }
    }
  </style>
