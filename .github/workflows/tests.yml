name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every platform the wheels are built for, on the Python used in development;
        # the oldest and newest supported Pythons on Linux.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12']
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.14'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install CPU-only PyTorch (Linux)
        # PyPI's Linux torch brings the CUDA libraries (gigabytes the tests never use).
        if: runner.os == 'Linux'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test the Rust core alone
        run: cargo test --manifest-path rust/Cargo.toml -p zeit-core --release

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          python -c "import zeit._rust"

      - name: Run pytest
        run: |
          pytest -v tests/

      - name: Run pytest on the Rust core
        # The modules already converted to Rust (RUST_MIGRATION.md) in place of
        # the C++ ones: the whole suite must pass on either core.
        env:
          ZEIT_BACKEND: rust
        run: |
          pytest -v tests/

      - name: Time the Rust core against the C++ one
        # The modules already in Rust against their C++, in turns in one process,
        # into the job summary. Informative only: shared runners are noisy.
        if: matrix.python-version == '3.12'
        continue-on-error: true
        shell: bash
        run: |
          python benchmarks/bench_core.py --backend cpp rust --rounds 3 --min-time 0.5 --out bench.json
          { echo '### C++ (A) and Rust (B) on ${{ matrix.os }}'; echo '```'
            python benchmarks/bench_core.py --compare bench.json:cpp bench.json:rust; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
