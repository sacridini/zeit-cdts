name: Build and Publish Wheels

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: # Permite rodar o workflow manualmente no GitHub

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cria máquinas para Linux, Windows e macOS
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          # Sem 32 bits (i686/win32), PyPy, os builds free-threaded (cp314t), que o módulo
          # não declara suportar, e o Python 3.15 até o numba e o torch terem wheels
          # para ele; o cibuildwheel 4 já não constrói o Python 3.8.
          CIBW_SKIP: "pp* *i686 *win32 cp3??t-* cp315-*"
          # Cada wheel construído é instalado num ambiente limpo e testado com a suíte
          # inteira, num Python por sistema (os outros são testados a partir do código
          # no workflow Tests). O musllinux fica de fora: o torch não tem wheels para ele.
          CIBW_TEST_EXTRAS: "dev"
          CIBW_TEST_COMMAND: "python -c \"import zeit._core\" && pytest {project}/tests -q -p no:cacheprovider"
          # Os contêineres manylinux e musllinux não têm Rust; as máquinas Windows e macOS têm.
          CIBW_BEFORE_ALL_LINUX: "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_TEST_SKIP: "cp39-* cp310-* cp311-* cp313-* cp314-* *musllinux*"
          # No contêiner manylinux, o torch só de CPU (o do PyPI traz gigabytes de CUDA).
          CIBW_BEFORE_TEST_LINUX: "pip install torch --index-url https://download.pytorch.org/whl/cpu"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Condição para fazer o upload pro PyPI APENAS quando você criar uma tag de versão (ex: git tag v0.1.0)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    environment:
      name: pypi
      url: https://pypi.org/p/zeit-cdts
      
    permissions:
      id-token: write # Permite usar o PyPI "Trusted Publisher" (mais seguro que senha)
      
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
