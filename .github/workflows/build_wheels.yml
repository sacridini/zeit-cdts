name: Build and Publish Wheels

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: # Permite rodar o workflow manualmente no GitHub

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cria m√°quinas para Linux, Windows e macOS
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # Importante caso a pasta third_party/eigen seja um subm√≥dulo do git

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          # Sem 32 bits (i686/win32), PyPy, os builds free-threaded (cp314t), que o m√≥dulo
          # C++ n√£o declara suportar, e o Python 3.15 at√© o numba e o torch terem wheels
          # para ele; o cibuildwheel 4 j√° n√£o constr√≥i o Python 3.8.
          CIBW_SKIP: "pp* *i686 *win32 cp3??t-* cp315-*"
          # Cada wheel constru√≠do √© instalado num ambiente limpo e testado com a su√≠te
          # inteira, num Python por sistema (os outros s√£o testados a partir do c√≥digo
          # no workflow Tests). O musllinux fica de fora: o torch n√£o tem wheels para ele.
          CIBW_TEST_EXTRAS: "dev"
          # O n˙cleo Rust (zeit._rust) È opcional no setup.py: um wheel construÌdo sem ele
          # passaria na suÌte com o n˙cleo C++. O import garante que ele est· l·.
          CIBW_TEST_COMMAND: "python -c \"import zeit._rust\" && pytest {project}/tests -q -p no:cacheprovider"
          # Os contÍineres manylinux e musllinux n„o tÍm Rust; as m·quinas Windows e macOS tÍm.
          CIBW_BEFORE_ALL_LINUX: "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_TEST_SKIP: "cp39-* cp310-* cp311-* cp313-* cp314-* *musllinux*"
          # No cont√™iner manylinux, o torch s√≥ de CPU (o do PyPI traz gigabytes de CUDA).
          CIBW_BEFORE_TEST_LINUX: "pip install torch --index-url https://download.pytorch.org/whl/cpu"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build sdist
        run: pipx run build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Condi√ß√£o para fazer o upload pro PyPI APENAS quando voc√™ criar uma tag de vers√£o (ex: git tag v0.1.0)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    environment:
      name: pypi
      url: https://pypi.org/p/zeit-cdts
      
    permissions:
      id-token: write # Permite usar o PyPI "Trusted Publisher" (mais seguro que senha)
      
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
