name: Publish Container Images

# The images of Dockerfile.cpu and Dockerfile on the GitHub Container Registry at each version,
# for Docker and for Apptainer on a cluster:
#   apptainer pull zeit.sif docker://ghcr.io/sacridini/zeit-cdts:2.3.0
#   apptainer pull zeit-gpu.sif docker://ghcr.io/sacridini/zeit-cdts:2.3.0-gpu
# The CPU image is built on native x86_64 and aarch64 machines (no emulation, which would take
# an hour to compile the Rust core) and published as one tag for both.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/zeit-cdts

permissions:
  contents: read
  packages: write

jobs:
  cpu:
    name: CPU image on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: The version
        id: version
        run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build, check and push
        run: |
          tag="$IMAGE:${{ steps.version.outputs.version }}-${{ matrix.arch }}"
          docker buildx build -f Dockerfile.cpu -t "$tag" --load .
          docker run --rm "$tag" zeit doctor --no-network
          docker run --rm "$tag" python -c "import importlib.metadata, zeit.ai; print(importlib.metadata.version('zeit-cdts'))"
          docker push "$tag"

  cpu-manifest:
    name: CPU image, both architectures
    needs: cpu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The version
        id: version
        run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: One tag for amd64 and arm64
        run: |
          v="${{ steps.version.outputs.version }}"
          docker buildx imagetools create -t "$IMAGE:$v" -t "$IMAGE:latest" "$IMAGE:$v-amd64" "$IMAGE:$v-arm64"

  gpu:
    name: GPU image (CUDA, amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Room for the CUDA image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: The version
        id: version
        run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, check and push
        run: |
          v="${{ steps.version.outputs.version }}"
          docker build -f Dockerfile -t "$IMAGE:$v-gpu" -t "$IMAGE:latest-gpu" .
          docker run --rm "$IMAGE:$v-gpu" python -c "import importlib.metadata, zeit.ai; print(importlib.metadata.version('zeit-cdts'))"
          docker push "$IMAGE:$v-gpu"
          docker push "$IMAGE:latest-gpu"
