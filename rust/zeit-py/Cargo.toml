[package]
name = "zeit-py"
description = "Python bindings of zeit-core: the zeit._core extension module"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
zeit-core = { path = "../zeit-core" }
pyo3 = "0.30"
numpy = "0.30"
mimalloc = { version = "0.1.52", default-features = false }
